<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="听写">
<meta name="theme-color" content="#1a1a2e">
<link rel="manifest" href="manifest.json">
<title>四下听写练习</title>
<style>
  :root {
    --bg: #1a1a2e;
    --card: #16213e;
    --accent: #e8b84b;
    --accent2: #f0c060;
    --text: #f0f0f5;
    --muted: rgba(240,240,245,0.45);
    --sub: rgba(240,240,245,0.25);
    --safe-top: env(safe-area-inset-top, 0px);
    --safe-bot: env(safe-area-inset-bottom, 0px);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html, body {
    height: 100%; width: 100%; overflow: hidden;
    font-family: "PingFang SC", "Noto Sans SC", "Microsoft YaHei", sans-serif;
    background: var(--bg);
    color: var(--text);
    user-select: none;
    -webkit-user-select: none;
  }

  /* ── screen system ── */
  .screen {
    position: fixed; inset: 0;
    display: flex; flex-direction: column;
    padding-top: calc(var(--safe-top) + 16px);
    padding-bottom: calc(var(--safe-bot) + 16px);
    padding-left: 20px; padding-right: 20px;
    transition: opacity 0.25s ease, transform 0.25s ease;
    opacity: 1; transform: translateX(0);
    will-change: transform, opacity;
  }
  .screen.hidden { opacity: 0; pointer-events: none; transform: translateX(30px); }
  .screen.hidden-left { opacity: 0; pointer-events: none; transform: translateX(-30px); }

  /* ── HOME ── */
  #homeScreen { overflow: hidden; }
  .app-header {
    text-align: center;
    padding: 20px 0 24px;
    flex-shrink: 0;
  }
  .app-header .badge {
    display: inline-block;
    background: var(--accent);
    color: #1a1a2e;
    font-size: 11px;
    font-weight: 700;
    padding: 3px 10px;
    border-radius: 20px;
    letter-spacing: 1px;
    margin-bottom: 10px;
  }
  .app-header h1 {
    font-size: 26px;
    font-weight: 700;
    color: var(--text);
    letter-spacing: 2px;
  }
  .app-header p {
    font-size: 13px;
    color: var(--muted);
    margin-top: 6px;
  }
  .lesson-list {
    flex: 1;
    overflow-y: auto;
    -webkit-overflow-scrolling: touch;
    scrollbar-width: none;
    padding-bottom: 8px;
  }
  .lesson-list::-webkit-scrollbar { display: none; }
  .lesson-item {
    display: flex; align-items: center;
    background: var(--card);
    border-radius: 16px;
    padding: 16px 18px;
    margin-bottom: 10px;
    cursor: pointer;
    transition: background 0.15s, transform 0.1s;
    border: 1px solid rgba(255,255,255,0.06);
    -webkit-tap-highlight-color: transparent;
  }
  .lesson-item:active { background: #1e2d50; transform: scale(0.98); }
  .lesson-num {
    width: 36px; height: 36px;
    background: rgba(232,184,75,0.15);
    border-radius: 10px;
    display: flex; align-items: center; justify-content: center;
    font-size: 14px; font-weight: 700;
    color: var(--accent);
    flex-shrink: 0;
    margin-right: 14px;
  }
  .lesson-info { flex: 1; }
  .lesson-name { font-size: 16px; font-weight: 500; color: var(--text); }
  .lesson-count { font-size: 12px; color: var(--muted); margin-top: 3px; }
  .lesson-arrow { color: var(--sub); font-size: 18px; }
  .yuandi-item { border-color: rgba(94,201,138,0.15); }

  /* ── DICTATION ── */
  #dictScreen {
    justify-content: space-between;
    text-align: center;
  }
  .dict-top {
    display: flex; align-items: center; justify-content: space-between;
    flex-shrink: 0; padding-bottom: 16px;
  }
  .back-btn-icon {
    width: 40px; height: 40px;
    background: rgba(255,255,255,0.08);
    border-radius: 12px;
    border: none; cursor: pointer;
    color: var(--text); font-size: 18px;
    display: flex; align-items: center; justify-content: center;
  }
  .dict-lesson-name {
    font-size: 14px; color: var(--muted); font-weight: 500;
  }
  .dict-placeholder { width: 40px; }

  /* progress dots */
  .progress-wrap {
    flex-shrink: 0;
    padding: 0 0 20px;
  }
  .progress-track {
    height: 4px;
    background: rgba(255,255,255,0.1);
    border-radius: 2px;
    overflow: hidden;
    margin-bottom: 10px;
  }
  #progressFill {
    height: 100%;
    background: var(--accent);
    border-radius: 2px;
    transition: width 0.3s ease;
    width: 0%;
  }
  #wordCountText {
    font-size: 12px; color: var(--sub); text-align: center;
  }

  /* pinyin center */
  .dict-center {
    flex: 1;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    padding: 20px 0;
  }
  #pinyinDisplay {
    font-size: 46px;
    font-weight: 300;
    color: var(--text);
    letter-spacing: 6px;
    line-height: 1.4;
    text-align: center;
    transition: opacity 0.2s;
  }
  #hintLabel {
    margin-top: 18px;
    font-size: 13px;
    color: var(--sub);
  }

  /* circular timer */
  .timer-wrap {
    flex-shrink: 0;
    display: flex; justify-content: center;
    padding: 10px 0 24px;
  }
  #timerSvg { transform: rotate(-90deg); }
  #timerTrack { stroke: rgba(255,255,255,0.1); }
  #timerArc {
    stroke: var(--accent);
    stroke-dasharray: 188.5;
    stroke-dashoffset: 0;
    transition: stroke-dashoffset 0.1s linear;
  }
  .timer-text {
    position: absolute;
    font-size: 18px; font-weight: 600;
    color: var(--accent);
  }
  .timer-box {
    position: relative;
    display: flex; align-items: center; justify-content: center;
    width: 72px; height: 72px;
  }

  /* bottom buttons */
  .dict-bottom { flex-shrink: 0; }
  .nav-row {
    display: grid; grid-template-columns: 1fr 2fr 1fr;
    gap: 10px;
  }
  .nav-btn {
    height: 54px;
    border: none; border-radius: 16px;
    font-size: 15px; font-weight: 600;
    cursor: pointer; font-family: inherit;
    transition: opacity 0.15s, transform 0.1s;
    display: flex; align-items: center; justify-content: center;
  }
  .nav-btn:active { transform: scale(0.96); }
  .nav-btn:disabled { opacity: 0.25; }
  #prevBtn { background: rgba(255,255,255,0.1); color: var(--text); }
  #nextBtn { background: var(--accent); color: #1a1a2e; font-size: 16px; }
  #skipEndBtn {
    background: rgba(255,255,255,0.06);
    color: var(--muted);
    font-size: 12px;
    font-weight: 400;
    border-radius: 16px;
    border: none; cursor: pointer; font-family: inherit;
    transition: opacity 0.15s;
    height: 54px;
    display: flex; align-items: center; justify-content: center;
    width: 100%; margin-top: 10px;
  }

  /* ── END SCREEN ── */
  #endScreen { overflow: hidden; }
  .end-header { flex-shrink: 0; text-align: center; padding: 20px 0 22px; }
  .end-icon {
    width: 64px; height: 64px;
    background: rgba(232,184,75,0.15);
    border-radius: 50%;
    margin: 0 auto 14px;
    display: flex; align-items: center; justify-content: center;
    font-size: 32px;
  }
  .end-header h2 { font-size: 22px; font-weight: 700; color: var(--text); }
  .end-header p { font-size: 13px; color: var(--muted); margin-top: 6px; }
  .word-grid {
    flex: 1;
    overflow-y: auto;
    -webkit-overflow-scrolling: touch;
    scrollbar-width: none;
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 8px;
    align-content: start;
    padding-bottom: 12px;
  }
  .word-grid::-webkit-scrollbar { display: none; }
  .word-card {
    background: var(--card);
    border-radius: 12px;
    padding: 10px 6px;
    text-align: center;
    border: 1px solid rgba(255,255,255,0.06);
  }
  .pinyin-small {
    font-size: 9px;
    color: var(--sub);
    margin-bottom: 5px;
    letter-spacing: 0.3px;
    line-height: 1.5;
    word-break: break-all;
  }
  .char { font-size: 19px; color: var(--text); font-weight: 500; }
  .end-actions { flex-shrink: 0; padding-top: 14px; }
  .end-btn {
    display: block; width: 100%;
    height: 52px; border: none;
    border-radius: 16px; font-size: 16px;
    font-family: inherit; cursor: pointer;
    font-weight: 600;
    transition: opacity 0.15s, transform 0.1s;
  }
  .end-btn:active { transform: scale(0.98); }
  #restartBtn { background: var(--accent); color: #1a1a2e; margin-bottom: 10px; }
  #backBtn2 { background: rgba(255,255,255,0.08); color: var(--muted); }
</style>
</head>
<body>

<!-- HOME -->
<div class="screen" id="homeScreen">
  <div class="app-header">
    <div class="badge">四年级下册</div>
    <h1>听写练习</h1>
    <p>选择课次，开始听写</p>
  </div>
  <div class="lesson-list" id="lessonList"></div>
</div>

<!-- DICTATION -->
<div class="screen hidden" id="dictScreen">
  <div class="dict-top">
    <button class="back-btn-icon" onclick="backToSelect()">←</button>
    <div class="dict-lesson-name" id="dictLessonName"></div>
    <div class="dict-placeholder"></div>
  </div>
  <div class="progress-wrap">
    <div class="progress-track"><div id="progressFill"></div></div>
    <div id="wordCountText"></div>
  </div>
  <div class="dict-center">
    <div id="pinyinDisplay"></div>
    <div id="hintLabel">请书写汉字</div>
  </div>
  <div class="timer-wrap">
    <div class="timer-box">
      <svg id="timerSvg" width="72" height="72" viewBox="0 0 72 72">
        <circle id="timerTrack" cx="36" cy="36" r="30" fill="none" stroke-width="5"/>
        <circle id="timerArc"   cx="36" cy="36" r="30" fill="none" stroke-width="5"
                stroke-linecap="round"/>
      </svg>
      <span class="timer-text" id="timerNum">7</span>
    </div>
  </div>
  <div class="dict-bottom">
    <div class="nav-row">
      <button class="nav-btn" id="prevBtn" onclick="prevWord()">上一个</button>
      <button class="nav-btn" id="nextBtn" onclick="nextWord()">下一个 →</button>
      <button class="nav-btn" id="endNowBtn" onclick="showEnd()" style="font-size:12px;background:rgba(255,255,255,0.06);color:var(--muted)">结束</button>
    </div>
  </div>
</div>

<!-- END -->
<div class="screen hidden" id="endScreen">
  <div class="end-header">
    <div class="end-icon">✓</div>
    <h2>本课听写完毕</h2>
    <p>请核对答案是否正确</p>
  </div>
  <div class="word-grid" id="wordGrid"></div>
  <div class="end-actions">
    <button class="end-btn" id="restartBtn" onclick="restartLesson()">再听一遍</button>
    <button class="end-btn" id="backBtn2" onclick="backToSelect()" style="margin-top:10px">返回选课</button>
  </div>
</div>

<script>

const DURATION = 7000;
const ARC = 188.5; // 2π×30

let currentLesson = null;
let currentIndex = 0;
let autoTimer = null;
let tickTimer = null;
let tickStart = 0;

// ── screen ──────────────────────────────────────────────────
function showScreen(id) {
  document.querySelectorAll('.screen').forEach(s => {
    if (s.id === id) { s.classList.remove('hidden','hidden-left'); }
    else {
      s.classList.remove('hidden','hidden-left');
      s.classList.add(id === 'homeScreen' ? 'hidden-left' : 'hidden');
    }
  });
}

// ── home ────────────────────────────────────────────────────
(function initHome() {
  const c = document.getElementById('lessonList');
  LESSONS.forEach(lesson => {
    const div = document.createElement('div');
    const isYuandi = typeof lesson.num === 'string' && lesson.num.startsWith('园');
    div.className = 'lesson-item' + (isYuandi ? ' yuandi-item' : '');
    const badgeStyle = isYuandi ? 'style="background:rgba(100,200,140,0.18);color:#5ec98a;font-size:11px;"' : '';
    const displayName = lesson.title.replace(/^第\d+课\s*/, '');
    div.innerHTML =
      '<div class="lesson-num" ' + badgeStyle + '>' + lesson.num + '</div>' +
      '<div class="lesson-info">' +
        '<div class="lesson-name">' + displayName + '</div>' +
        '<div class="lesson-count">' + lesson.words.length + ' 个词语</div>' +
      '</div>' +
      '<div class="lesson-arrow">›</div>';
    div.onclick = () => startLesson(lesson);
    c.appendChild(div);
  });
})();

// ── dictation ───────────────────────────────────────────────
function startLesson(lesson) {
  currentLesson = lesson;
  currentIndex = 0;
  document.getElementById('dictLessonName').textContent = lesson.title;
  showScreen('dictScreen');
  showWord();
}

function showWord() {
  clearTimers();
  if (currentIndex >= currentLesson.words.length) { showEnd(); return; }
  const item = currentLesson.words[currentIndex];
  const total = currentLesson.words.length;
  const isPoemMode = currentLesson.mode === 'poem';

  // progress
  document.getElementById('progressFill').style.width =
    (currentIndex / total * 100) + '%';
  document.getElementById('wordCountText').textContent =
    '第 ' + (currentIndex + 1) + ' 句 / 共 ' + total + ' 句';

  // display
  const pd = document.getElementById('pinyinDisplay');
  pd.style.opacity = '0';
  setTimeout(() => {
    if (isPoemMode) {
      pd.style.fontSize = '17px';
      pd.style.letterSpacing = '2px';
      pd.style.color = 'var(--muted)';
      pd.textContent = item.hint;
    } else {
      pd.style.fontSize = '';
      pd.style.letterSpacing = '';
      pd.style.color = '';
      pd.textContent = item.pinyin;
    }
    pd.style.opacity = '1';
  }, 100);

  document.getElementById('hintLabel').textContent =
    isPoemMode ? '请默写这一句' : '请书写汉字';
  document.getElementById('wordCountText').textContent =
    isPoemMode
      ? '第 ' + (currentIndex + 1) + ' 句 / 共 ' + total + ' 句'
      : '第 ' + (currentIndex + 1) + ' 个 / 共 ' + total + ' 个';

  document.getElementById('prevBtn').disabled = currentIndex === 0;
  speak(item.word);
  startCountdown(isPoemMode ? 10000 : 7000);
}

function speak(text) {
  if (!window.speechSynthesis) return;
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text);
  u.lang = 'zh-CN'; u.rate = 0.82; u.pitch = 1.0;
  // speak twice with gap
  speechSynthesis.speak(u);
  u.onend = () => {
    setTimeout(() => {
      const u2 = new SpeechSynthesisUtterance(text);
      u2.lang = 'zh-CN'; u2.rate = 0.82;
      speechSynthesis.speak(u2);
    }, 800);
  };
}

function startCountdown(dur) {
  dur = dur || 7000;
  const arc = document.getElementById('timerArc');
  const num = document.getElementById('timerNum');
  arc.style.transition = 'none';
  arc.style.strokeDashoffset = '0';
  arc.getBoundingClientRect();
  arc.style.transition = 'stroke-dashoffset ' + (dur/1000) + 's linear';
  arc.style.strokeDashoffset = String(ARC);

  tickStart = Date.now();
  function tick() {
    const elapsed = Date.now() - tickStart;
    const remaining = Math.max(0, Math.ceil((dur - elapsed) / 1000));
    num.textContent = remaining;
    if (elapsed < dur) tickTimer = setTimeout(tick, 200);
  }
  tick();
  autoTimer = setTimeout(() => { currentIndex++; showWord(); }, dur);
}

function clearTimers() {
  if (autoTimer) { clearTimeout(autoTimer); autoTimer = null; }
  if (tickTimer) { clearTimeout(tickTimer); tickTimer = null; }
}

function nextWord() { clearTimers(); currentIndex++; showWord(); }
function prevWord() { clearTimers(); if (currentIndex > 0) currentIndex--; showWord(); }

// ── end ─────────────────────────────────────────────────────
function showEnd() {
  clearTimers();
  if (window.speechSynthesis) speechSynthesis.cancel();
  // fill progress to 100%
  document.getElementById('progressFill').style.width = '100%';

  showScreen('endScreen');
  const grid = document.getElementById('wordGrid');
  grid.innerHTML = '';
  const isPoemMode = currentLesson.mode === 'poem';
  if (isPoemMode) {
    grid.style.gridTemplateColumns = '1fr';
    currentLesson.words.forEach(item => {
      const card = document.createElement('div');
      card.className = 'word-card';
      card.style.textAlign = 'left';
      card.style.padding = '12px 16px';
      card.innerHTML =
        '<div class="pinyin-small" style="margin-bottom:6px">' + item.hint + '</div>' +
        '<div class="char" style="font-size:18px;letter-spacing:3px">' + item.word + '</div>';
      grid.appendChild(card);
    });
  } else {
    grid.style.gridTemplateColumns = '';
    currentLesson.words.forEach(item => {
      const card = document.createElement('div');
      card.className = 'word-card';
      card.innerHTML =
        '<div class="pinyin-small">' + item.pinyin + '</div>' +
        '<div class="char">' + item.word + '</div>';
      grid.appendChild(card);
    });
  }
}

function restartLesson() { startLesson(currentLesson); }
function backToSelect() {
  clearTimers();
  if (window.speechSynthesis) speechSynthesis.cancel();
  showScreen('homeScreen');
}

// ── PWA service worker ───────────────────────────────────────
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('./sw.js').catch(() => {});
}
